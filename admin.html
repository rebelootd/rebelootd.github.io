<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Rebel OOTD</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>🤎 Admin Rebel OOTD</h1>

<div class="card">

<h3>Tambah Produk</h3>

<input id="nama" type="text" placeholder="Nama Produk">

<br><br>

<input id="harga" type="number" placeholder="Harga">

<br><br>

<input id="rating" type="number" step="0.1" placeholder="Rating">

<br><br>

<label>📷 Pilih Gambar</label>

<br>

<input
type="file"
id="fileGambar"
accept="image/*">

<br><br>

<input
id="gambar"
type="text"
placeholder="Link gambar akan muncul otomatis"
readonly>

<br><br>

<input
id="link"
type="text"
placeholder="Link Shopee">

<br><br>

<button id="simpan">
💾 Simpan Produk
</button>

</div>

<h2>Daftar Produk</h2>

<div id="listProduk"></div>

<script type="module" src="firebase.js"></script>
<script type="module" src="admin.js"></script>

</body>

</html>
