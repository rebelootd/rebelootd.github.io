<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebel OOTD</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤎 Rebel OOTD</h1>

<input type="text" placeholder="🔍 Cari Produk...">

<h2>Kategori</h2>

<div class="menu">
<a href="#">👠 Heels</a>
<a href="#">🩴 Sandal</a>
<a href="#">👟 Sepatu</a>
<a href="#">👜 Tas</a>
<a href="#">👗 Dress</a>
<a href="#">👚 Atasan</a>
<a href="#">👖 Celana</a>
<a href="#">🤎 Rok</a>
<a href="#">💄 Beauty</a>
</div>

<h2>🔥 Produk Terbaru</h2>

<div class="card">
<img id="foto" width="250">

<h3 id="nama"></h3>

<p id="rating"></p>

<p id="harga"></p>

<a id="shopee" target="_blank">
<button>🛒 Shopee</button>
</a>

<a id="tiktok" target="_blank">
<button>🎵 TikTok Shop</button>
</a>

</div>

<script>
fetch("products.json")
.then(res => res.json())
.then(data => {
const produk = data[0];

document.getElementById("foto").src = produk.foto;
document.getElementById("nama").innerText = produk.nama;
document.getElementById("rating").innerText = "⭐ " + produk.rating;
document.getElementById("harga").innerText = "💰 " + produk.harga;
document.getElementById("shopee").href = produk.shopee;
document.getElementById("tiktok").href = produk.tiktok;
});
</script>

</body>
</html>
